<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="theme-color" content="#ffc400">

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#111315;color:#fff;font-family:Arial,sans-serif;line-height:1.6}

    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:28px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border:2px solid #ffc400;border-radius:10px;background:#ffc400;color:#111315;text-decoration:none;font-weight:700}
